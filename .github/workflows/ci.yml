name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Infraestrutura real para os testes de integração e concorrência (nada de mocks).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wagering
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
      ministack:
        image: ministackorg/ministack:1.5.34
        ports: ["4566:4566"]
        options: >-
          --health-cmd "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\""
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SQS_ENDPOINT: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Testes (unidade, integração e concorrência)
        run: bun test

  compose:
    name: docker compose sobe do zero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Subir a stack (Postgres, MiniStack, setup, 3 instâncias)
        run: docker compose up -d --build
      - name: As três instâncias respondem
        run: |
          for port in 3001 3002 3003; do
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$port/health/live" && echo && break
              sleep 2
            done
            curl -fsS "http://localhost:$port/health/live" > /dev/null
          done
          docker compose ps -a
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar
        if: always()
        run: docker compose down -v
