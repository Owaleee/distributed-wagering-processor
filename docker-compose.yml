name: distributed-wagering

# Portas no host configuráveis (ex.: POSTGRES_PORT=5433 docker compose up) para não
# conflitar com um PostgreSQL ou emulador já em uso na máquina.
x-app: &app
  build: .
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wagering
    SQS_ENDPOINT: http://ministack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    PORT: "3000"
  depends_on:
    setup:
      condition: service_completed_successfully
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.34
    ports: ["${SQS_PORT:-4566}:4566"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Único responsável por migrations e filas; as instâncias só sobem depois que ele termina.
  setup:
    build: .
    command: ["bun", "scripts/setup.ts"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    restart: "no"

  # Três instâncias idênticas: a correção não pode depender de haver uma só.
  app-1:
    <<: *app
    ports: ["${APP1_PORT:-3001}:3000"]
  app-2:
    <<: *app
    ports: ["${APP2_PORT:-3002}:3000"]
  app-3:
    <<: *app
    ports: ["${APP3_PORT:-3003}:3000"]
